name: Hermes CI

on:
  pull_request:
    paths:
      - "hermes/**"
      - "scripts/build-hermes-candidate.py"
      - "scripts/verify-hermes-release.sh"
      - ".github/workflows/hermes-ci.yml"
  push:
    branches: [main]
    paths:
      - "hermes/**"
      - "scripts/build-hermes-candidate.py"
      - "scripts/verify-hermes-release.sh"
      - ".github/workflows/hermes-ci.yml"

permissions:
  contents: read

jobs:
  verify-hermes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Hermes source and candidate
        run: ./scripts/verify-hermes-release.sh
      - name: Build candidate twice and require byte identity
        run: |
          set -eu
          candidate_root="$RUNNER_TEMP/hermes-source-candidate"
          mkdir -p "$candidate_root"
          ./scripts/build-hermes-candidate.py \
            --output "$candidate_root/first" > "$candidate_root/first-build.json"
          ./scripts/build-hermes-candidate.py \
            --output "$candidate_root/second" > "$candidate_root/second-build.json"
          first=$(sha256sum "$candidate_root/first/remanager-hermes-agentic-1.0.0.tar.gz" | cut -d' ' -f1)
          second=$(sha256sum "$candidate_root/second/remanager-hermes-agentic-1.0.0.tar.gz" | cut -d' ' -f1)
          test "$first" = "$second"
          cmp "$candidate_root/first/remanager-hermes-agentic-1.0.0.tar.gz" \
            "$candidate_root/second/remanager-hermes-agentic-1.0.0.tar.gz"
          cp "$candidate_root/first-build.json" "$candidate_root/first/BUILD-RESULT.json"
          printf '%s  %s\n' "$first" remanager-hermes-agentic-1.0.0.tar.gz \
            > "$candidate_root/first/REPRODUCIBLE-SHA256SUMS"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remanager-hermes-source-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hermes-source-candidate/first/
          if-no-files-found: error
          retention-days: 14
