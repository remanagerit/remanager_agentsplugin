name: reman-agentic
version: 1.2.14
description: Governed REmanager Accounting and scoped document archive tools using https://app.remanager.it
author: REman
provides_tools:
  - reman_agentic_upload_session_create
  - reman_agentic_upload_session_status
  - reman_document_archive_action
  - reman_agentic_upload_file_base64
  - reman_agentic_upload_session_release
  - reman_available_tools
  - reman_accounting_tool_contract
  - reman_accounting_read
  - reman_accounting_prepare_action
  - reman_accounting_action
  - reman_agentic_action_cancel
  - reman_accounting_prepare_file_action
  - reman_accounting_list_companies
  - reman_accounting_search_partners
  - reman_accounting_search_non_electronic_invoices
  - reman_accounting_create_non_electronic_invoice
requires_env:
  - name: REMAN_AGENT_TOKEN
    description: Scoped external-agent token created in REman Account settings
    secret: true
